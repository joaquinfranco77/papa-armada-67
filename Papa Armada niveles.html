<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Papa Armada - 5 Niveles</title><style>
:root{color-scheme:dark;--bg:#14121a;--fg:#f3efe6;--ac:#e53935;--gr:#7bd34a;--pn:#241f2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;justify-content:center}

.b{border-color:var(--ac);background:var(--ac);font-weight:700}
small{opacity:.85}#ov{justify-content:safe center}#ov.m{justify-content:space-between;background:#0009;padding:18px}.logo{font-size:clamp(34px,8vw,72px);color:#efe3c4;-webkit-text-stroke:3px #111;paint-order:stroke fill;letter-spacing:2px}.logo span{color:var(--ac)}.cd{display:flex;flex-direction:column;align-items:center;width:130px;background:var(--pn);border-radius:8px;padding:6px}h3{margin:6px 0 0}button img{display:block;margin:0 auto 4px}
</style></head><body><div id="w"><canvas id="c" width="960" height="600"></canvas><div id="ov"></div></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),O=document.getElementById('ov'),W=960,H=600;
const R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),WK=Object.keys;
const WP={
pistola:{n:'Pistola',d:15,c:.35,r:320,s:650,p:1,e:.05,$:20},

{hp:10,v:75,r:12,d:4,c:'#7bd34a'},

 S={m:'play',w:1,t:0,dur:20,lv:1,xp:0,mat:15,pend:0,kills:0,sp:1,of:0,lvs:1+(currLvl-1)*0.25,
 P:{x:W/2,y:H/2,hp:50,mh:50,ar:0,rg:0,sp:1,dm:0,as:0,rn:0,mg:0,iv:0,u:{},ws:[{k:'pistola',t:1,cd:0,a:0}]},E:[],B:[],M:[],F:[],eb:[],bgd:[]};
 for(let i=0;i<150;i++) S.bgd.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()});

}

function spawnB(t){const s=ET[t],hp=s.hp*(1+S.w*.3)*S.lvs;S.E.push({...s,t,x:W/2,y:-50,hp,mhp:hp,f:0,a:0})}
function startWave(){S.m='play';S.t=0;S.dur=Math.min(20+(S.w-1)*4,75);S.sp=1;S.E=[];S.B=[];S.eb=[];S.F=[];O.innerHTML='';O.className='';const P=S.P;P.hp=Math.min(P.mh,P.hp+P.mh*.4);
if(S.w==10)spawnB(4);if(S.w==20)spawnB(5);if(S.w==25)spawnB(6);}
function spawn(){if(S.E.length>110)return;const w=S.w,r=Math.random();let t=0;
if(w>=4&&r<.14)t=3;else if(w>=3&&r<.3)t=2;else if(w>=2&&r<.55)t=1;
const s=ET[t],q=Math.random()*4|0,x=q<2?R(20,W-20):(q==2?20:W-20),y=q>=2?R(20,H-20):(q==0?20:H-20),hp=s.hp*(1+w*.3)*S.lvs;

function upd(dt){const P=S.P,w=S.w;S.t+=dt;
const dx=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0),dy=(K.s||K.ArrowDown?1:0)-(K.w||K.ArrowUp?1:0),l=Math.hypot(dx,dy)||1;mv=dx||dy;if(dx)fx=dx;
P.x=Math.max(18,Math.min(W-18,P.x+dx/l*180*P.sp*dt));P.y=Math.max(18,Math.min(H-18,P.y+dy/l*180*P.sp*dt));

for(const e of S.E){e.f-=dt;const d=D(e,P),a=Math.atan2(P.y-e.y,P.x-e.x),c=Math.cos(a),s=Math.sin(a);
 if(e.sh){if(d>230||e.boss){e.x+=c*e.v*dt;e.y+=s*e.v*dt}if((e.a-=dt)<=0){e.a=e.boss?(e.t==6?1.4:2.0):2.2;
 if(e.boss){for(let i=0;i<8;i++){let ba=a+(i*Math.PI/4)+(e.t==6?R(-.2,.2):0);S.eb.push({x:e.x,y:e.y,vx:Math.cos(ba)*180,vy:Math.sin(ba)*180})}}
 else S.eb.push({x:e.x,y:e.y,vx:c*210,vy:s*210})}}
 else{e.x+=c*e.v*dt;e.y+=s*e.v*dt}
 if(d<e.r+14&&P.iv<=0)hurt(e.d*(1+w*.12)*S.lvs)}

 if(n){k.a=Math.atan2(n.y-P.y,n.x-P.x);if(k.cd<=0){k.cd=s.c*Math.pow(.92,k.t-1)/(1+P.as);
 const dm=s.d*(1+.6*(k.t-1))*(1+P.dm);
 for(let j=0;j<s.p;j++){const a=k.a+R(-s.e,s.e);S.B.push({x:P.x,y:P.y,vx:Math.cos(a)*s.s,vy:Math.sin(a)*s.s,dm,l:r/s.s,pi:s.pi||0,ex:s.ex,h:new Set()})}}}}
for(const b of S.B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;

function apply(u){const P=S.P;P[u[1]]+=u[2];P.u[u[1]]=(P.u[u[1]]||0)+1;if(u[1]=='mh')P.hp+=u[2]}
function lvl(){S.m='lvl';S.ch=[...UP].sort(()=>Math.random()-.5).slice(0,3);
O.innerHTML=`<h1>¡Nivel ${S.lv-S.pend+1}!</h1><small>Elige una mejora (${S.pend} pendiente/s)</small><div class=row>${S.ch.map((u,i)=>`<button onclick=pick(${i})>${ico('u',u[1])}${u[0]}</button>`).join('')}</div>`}
function pick(i){apply(S.ch[i]);S.pend--;S.pend>0?lvl():shop()}
function offer(){if(Math.random()<.6){const k=WK(WP)[R(0,5)|0];return{w:k,c:Math.round(WP[k].$*(1+S.w*.12))}}return{u:UP[R(0,UP.length)|0],c:10+S.w*3}}
function shop(){S.m='shop';S.of=S.of||Array.from({length:4},offer);const P=S.P;
O.innerHTML=`<h1>Tienda · Oleada ${S.w}</h1><div>Materiales: <b style="color:var(--gr)">${S.mat}</b> · Vida ${P.hp|0}/${P.mh}</div><div class=row>${S.of.map((o,i)=>{if(!o)return'<button disabled>Vendido</button>';let tx,ok=S.mat>=o.c;
 if(o.w){const h=P.ws.find(x=>x.k==o.w),s=WP[o.w];if(h){tx=`${ico('w',o.w)}${s.n}<br><small>MEJORAR a nivel ${h.t+1}</small>`;ok=ok&&h.t<4}else{tx=`${ico('w',o.w)}${s.n}<br><small>Arma nueva (${P.ws.length}/6)</small>`;ok=ok&&P.ws.length<6}}else tx=ico('u',o.u[1])+o.u[0];
 return`<button ${ok?'':'disabled'} onclick=buy(${i})>${tx}<br>${o.c} mat.</button>`}).join('')}</div>
<div class=row>${P.ws.map(k=>`<span style="outline:2px solid ${TC[k.t]};border-radius:6px;display:inline-block" title="${WP[k.k].n} Nv${k.t}">${ico('w',k.k)}</span>`).join('')}${WK(P.u).map(k=>`<span>${ico('u',k)}<small>x${P.u[k]}</small></span>`).join('')}</div>
<div class=row><button onclick=rr()>Cambiar (${3+S.w*2})</button><button class=b onclick=go()>Siguiente oleada ▶</button></div>`}
function buy(i){const o=S.of[i];S.mat-=o.c;if(o.w){const h=S.P.ws.find(x=>x.k==o.w);h?h.t++:S.P.ws.push({k:o.w,t:1,cd:0,a:0})}else apply(o.u);S.of[i]=0;shop()}

function go(){S.w++;S.of=0;startWave()}
function end(win){S.m='over';
 if(win && currLvl==maxLvl && maxLvl<5){maxLvl++;localStorage.setItem('papaLvl',maxLvl);}
 O.innerHTML=`<h1>${win?(currLvl==5?'¡JUEGO COMPLETADO!':'¡NIVEL SUPERADO!'):'Fin del juego'}</h1>
 <div>Oleada ${S.w} · ${TH[currLvl].n} · ${S.kills} enemigos eliminados</div>
 <div class=row>${win&&currLvl<5?`<button class=b onclick=playLvl(${currLvl+1})>Siguiente Nivel ▶</button>`:`<button class=b onclick=playLvl(${currLvl})>Jugar de nuevo</button>`}<button onclick=menu()>Menú principal</button></div>`}

function dot(x,y,r){X.beginPath();X.arc(x,y,r,0,7);X.fill()}
const IC={},NM=['Bicho','Murciélago','Gordo cornudo','Escupidor cíclope','JEFE: Rey Bestia','JEFE: Ojo del Vacío','JEFE FINAL: El Erradicador'],ED=['Persigue y muerde','Rápido y frágil, con alas','Lento, con cuernos y mucha vida','Escupe bolas a distancia','¡Sobrevive a la oleada 10!','Dispara en todas direcciones en oleada 20','El desafío definitivo en la ronda 25'],VIS={dm:'Aura roja y ceño fruncido',as:'Chispas amarillas',mh:'Papa más grande',sp:'Botas azules y estela',ar:'Chaleco y casco',rg:'Cruz verde flotante',rn:'Mira dorada en el ojo',mg:'Aro del imán'};
function wpn(g,k,t){g.strokeStyle=t>1?TC[t]:'#111';g.lineWidth=2;const r=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h)};
if(k=='pistola'){r(-6,-3,16,6,'#9aa');r(-6,2,6,8,'#654')}else if(k=='smg'){r(-8,-3,22,6,'#789');r(-2,3,5,9,'#456');r(-12,-2,5,4,'#555')}else if(k=='escopeta'){r(-12,-2,10,6,'#8a5a2b');r(-2,-4,22,3,'#777');r(-2,0,22,3,'#777')}else if(k=='francotirador'){r(-12,-2,10,5,'#4a6');r(-2,-2,28,4,'#576');r(2,-7,8,4,'#222')}else{r(-10,-4,26,8,'#6a6f55');r(16,-5,6,10,'#e53935');r(-10,3,6,8,'#444')}}
function uic(g,k){g.lineWidth=2;g.lineJoin='round';g.strokeStyle='#111';const poly=(c,p)=>{g.fillStyle=c;g.beginPath();for(let i=0;i<p.length;i+=2)g[i?'lineTo':'moveTo'](p[i],p[i+1]);g.closePath();g.fill();g.stroke()};
if(k=='dm'){const p=[];for(let i=0;i<12;i++){const a=i*.5236,r=i%2?6:12;p.push(Math.cos(a)*r,Math.sin(a)*r)}poly('#e53935',p)}else if(k=='as')poly('#ffd54a',[3,-12,-7,2,-1,2,-4,12,8,-3,1,-3]);else if(k=='mh'){g.fillStyle='#e53935';g.beginPath();g.moveTo(0,10);g.bezierCurveTo(-16,-2,-8,-14,0,-5);g.bezierCurveTo(8,-14,16,-2,0,10);g.fill();g.stroke()}else if(k=='sp')for(const o of[-5,5])poly('#4ac8ff',[-6+o,-9,3+o,0,-6+o,9,-2+o,9,7+o,0,-2+o,-9]);else if(k=='ar')poly('#9fb2c8',[-10,-10,10,-10,10,2,6,8,0,12,-6,8,-10,2]);else if(k=='rg')poly('#7bd34a',[-4,-11,4,-11,4,-4,11,-4,11,4,4,4,4,11,-4,11,-4,4,-11,4,-11,-4,-4,-4]);else if(k=='rn'){g.strokeStyle='#ffd54a';g.lineWidth=3;g.beginPath();g.arc(0,0,8,0,7);g.moveTo(-12,0);g.lineTo(12,0);g.moveTo(0,-12);g.lineTo(0,12);g.stroke()}else{g.lineWidth=7;g.strokeStyle='#e53935';g.beginPath();g.arc(0,0,7,0,Math.PI);g.moveTo(-7,0);g.lineTo(-7,-9);g.moveTo(7,0);g.lineTo(7,-9);g.stroke();g.strokeStyle='#eee';g.beginPath();g.moveTo(-7,-9);g.lineTo(-7,-12);g.moveTo(7,-9);g.lineTo(7,-12);g.stroke()}}
function icv(t,k){const id=t+k;if(!IC[id]){const c=document.createElement('canvas');c.width=c.height=56;const g=c.getContext('2d');g.translate(28,28);if(t=='w'){g.translate(-5,0);g.scale(1.1,1.1);wpn(g,k,1)}else if(t=='u'){g.scale(1.8,1.8);uic(g,k)}else{const e=ET[k],s=22/(e.r+(k==1?14:6));g.scale(s,s);blob({...e,x:0,y:0,t:k,f:0,a:0},g)}IC[id]={c,h:`<img src="${c.toDataURL()}" width=44 height=44>`}}return IC[id]}
const ico=(t,k)=>icv(t,k).h;
function blob(e,g=X){const r=e.r,t=e.t,w=Math.sin(S.t*8+e.x*.05)*1.5,F=e.f>0,col=F?'#fff':e.c;g.save();g.translate(e.x,e.y+w);g.lineJoin='round';g.lineWidth=3;g.strokeStyle='#111';
const P=(c,f)=>{g.fillStyle=c;g.beginPath();f();g.fill();g.stroke()},eye=(x,y,q,c)=>{g.lineWidth=2;g.fillStyle='#fff';g.beginPath();g.arc(x,y,q,0,7);g.fill();g.stroke();g.fillStyle=c||'#111';g.beginPath();g.arc(x+q*.25,y,q*.5,0,7);g.fill();g.lineWidth=3};
if(t==1)for(const s of[-1,1])P(F?'#fff':'#6b3fb0',()=>{g.moveTo(s*r*.5,-r*.2);g.lineTo(s*r*1.9,-r*(1.1+w*.15));g.lineTo(s*r*1.4,r*.4);g.lineTo(s*r*1.7,r*.9);g.lineTo(s*r*.5,r*.6)});
if(t==2)for(const a of[-.8,0,.8])P(F?'#fff':'#ccd',()=>{const dx=Math.sin(a),dy=-Math.cos(a),px=Math.cos(a),py=Math.sin(a);g.moveTo((dx*.8-px*.3)*r,(dy*.8-py*.3)*r);g.lineTo(dx*1.5*r,dy*1.5*r);g.lineTo((dx*.8+px*.3)*r,(dy*.8+py*.3)*r)});
if(t==3)for(const s of[-.6,0,.6]){g.beginPath();g.moveTo(s*r,r*.7);g.quadraticCurveTo(s*r*1.8,r*1.5,s*r*1.2+w,r*1.9);g.stroke()}
P(col,()=>g.arc(0,0,r,0,7));
if(t==0){g.beginPath();g.moveTo(-r*.4,-r*.8);g.lineTo(-r*.7,-r*1.5);g.moveTo(r*.4,-r*.8);g.lineTo(r*.7,-r*1.5);g.stroke();g.fillStyle='#ff5';for(const s of[-1,1]){g.beginPath();g.arc(s*r*.7,-r*1.5,3,0,7);g.fill();g.stroke()}eye(-r*.35,-r*.1,r*.3);eye(r*.35,-r*.1,r*.3);g.beginPath();g.moveTo(-r*.4,r*.4);for(let i=1;i<5;i++)g.lineTo(-r*.4+i*r*.2,r*(i%2?.65:.4));g.stroke()}
else if(t==1){eye(-r*.35,-r*.1,r*.3,'#e53935');eye(r*.35,-r*.1,r*.3,'#e53935');g.beginPath();g.moveTo(-r*.7,-r*.5);g.lineTo(-r*.1,-r*.25);g.moveTo(r*.7,-r*.5);g.lineTo(r*.1,-r*.25);g.stroke()}
else if(t==2){eye(-r*.35,-r*.1,r*.22,'#e53935');eye(r*.35,-r*.1,r*.22,'#e53935');g.beginPath();g.moveTo(-r*.7,-r*.45);g.lineTo(-r*.1,-r*.2);g.moveTo(r*.7,-r*.45);g.lineTo(r*.1,-r*.2);g.stroke();for(const s of[-1,1])P('#fff',()=>{g.moveTo(s*r*.5,r*.35);g.lineTo(s*r*.4,r*.95);g.lineTo(s*r*.2,r*.4)})}
else if(t==3){eye(0,-r*.1,r*.5);g.fillStyle='#111';g.beginPath();g.arc(0,r*.55,r*.2,0,7);g.fill()}
else if(t==4){eye(-r*.35,-r*.1,r*.3,'#ff0');eye(r*.35,-r*.1,r*.3,'#ff0');for(const s of[-1,1])P('#222',()=>{g.moveTo(s*r*.5,-r*.8);g.lineTo(s*r*1.2,-r*1.8);g.lineTo(s*r*.8,-r*.4)});g.beginPath();g.moveTo(-r*.5,r*.5);g.lineTo(r*.5,r*.5);g.stroke()}
else if(t==5){eye(0,-r*.2,r*.3,'#0f0');eye(-r*.4,r*.1,r*.2,'#0f0');eye(r*.4,r*.1,r*.2,'#0f0');g.beginPath();g.arc(0,r*.5,r*.2,0,Math.PI);g.stroke()}
else if(t==6){eye(-r*.3,-r*.2,r*.25,'#f00');eye(r*.3,-r*.2,r*.25,'#f00');eye(0,r*.1,r*.2,'#f00');for(let i=-1;i<=1;i++)P('#444',()=>{g.moveTo(i*r*.4,-r*.8);g.lineTo(i*r*.6,-r*1.8);g.lineTo((i+.5)*r*.4,-r*.8)})}
g.restore()}

function menuBg(){ET.slice(0,4).forEach((e,i)=>{for(let j=0;j<2;j++){const a=S.t*.35*(j?-1:1)+i*1.57+j,d=j?230:160;blob({...e,t:i,x:W/2+Math.cos(a)*d*1.5,y:H/2+Math.sin(a)*d*.75,f:0,a:0})}});S.P.ws.forEach((k,i)=>k.a=S.t*1.5+i)}
function menu(){newGame(1);S.m='menu';O.className='m';const P=S.P;P.u={dm:2,as:1,mh:3,sp:1,ar:3,rg:1,rn:1,mg:1};P.ws=WK(WP).map((k,i)=>({k,t:i%4+1,cd:0,a:0}));
let b='';for(let i=1;i<=5;i++){let u=i<=maxLvl;b+=`<button ${u?'class="b"':''} ${u?'':'disabled'} onclick="if(${u})playLvl(${i})" style="margin:5px">Nivel ${i}<br><small>${TH[i].n}</small></button>`;}
O.innerHTML=`<div><h1 class=logo>PAPA <span>ARMADA</span></h1><small>¡Completa cada nivel para desbloquear el siguiente!</small></div><div class=row style="max-width:750px">${b}</div><div class=row><button onclick=cat()>Armas y bichos</button><button onclick=how()>Cómo jugar</button></div>`}
function playLvl(l){newGame(l);}

function cat(){O.className='';const f=(a,fn)=>a.map(fn).join('');
O.innerHTML=`<h1>Arsenal y bichos</h1><h3>Armas</h3><div class=row>${f(WK(WP),k=>`<div class=cd>${ico('w',k)}<b>${WP[k].n}</b><small>Daño ${WP[k].d} · ${(1/WP[k].c).toFixed(1)}/s</small></div>`)}</div><h3>Mejoras (se ven en tu papa)</h3><div class=row>${f(UP,u=>`<div class=cd>${ico('u',u[1])}<b>${u[0]}</b><small>${VIS[u[1]]}</small></div>`)}</div><h3>Enemigos y Jefes</h3><div class=row>${f(NM,(n,i)=>`<div class=cd>${ico('e',i)}<b>${n}</b><small>${ED[i]}</small></div>`)}</div><button class=b onclick=menu()>Volver</button>`}
function how(){O.className='';O.innerHTML='<h1>Cómo jugar</h1><div>Muévete con <b>WASD</b> o las flechas. Tus armas apuntan y disparan solas.<br>Comienza en el nivel 1. Derrota al jefe de la ronda 25 para avanzar.<br>Cada mejora cambia el aspecto de tu papa. <b>Esc</b> o <b>P</b> pausan.</div><br><button class=b onclick=menu()>Volver</button>'}
function pz(){if(S.m=='play'){S.m='pause';O.className='';O.innerHTML='<h1>Pausa</h1><div class=row><button class=b onclick=pz()>Continuar</button><button onclick=menu()>Menú principal</button></div>'}else{S.m='play';O.innerHTML=''}}

function potato(P){const u=P.u,c=k=>u[k]||0,sc=1+Math.min(.5,c('mh')*.07),n=P.ws.length,t=S.t,b=mv?Math.sin(t*16)*2:0;
if(c('mg')){X.strokeStyle='#7bd34a66';X.lineWidth=2;X.setLineDash([6,8]);X.beginPath();X.arc(P.x,P.y,70*(1+P.mg),0,7);X.stroke();X.setLineDash([])}
if(c('dm')){const r=40+c('dm')*6,g=X.createRadialGradient(P.x,P.y,4,P.x,P.y,r);g.addColorStop(0,'#ff3b2f88');g.addColorStop(1,'#ff3b2f00');X.fillStyle=g;dot(P.x,P.y,r)}
P.ws.forEach((k,i)=>{const m=i/n*6.283-1.57;X.save();X.translate(P.x+Math.cos(m)*26*sc,P.y+Math.sin(m)*26*sc);X.rotate(k.a);if(Math.cos(k.a)<0)X.scale(1,-1);wpn(X,k.k,k.t);X.restore()});
X.save();X.translate(P.x,P.y);X.scale(sc,sc);if(P.iv>0&&(t*20|0)%2)X.globalAlpha=.5;
if(c('sp')&&mv){X.strokeStyle='#4ac8ff';X.lineWidth=3;for(let i=0;i<3;i++){X.beginPath();X.moveTo(-fx*20,-8+i*9);X.lineTo(-fx*(34+i*5),-8+i*9);X.stroke()}}
X.fillStyle='#0004';X.beginPath();X.ellipse(0,19,15,5,0,0,7);X.fill();
if(c('sp')){X.fillStyle='#4ac8ff';X.strokeStyle='#111';X.lineWidth=2;for(const x of[-8,8]){X.beginPath();X.ellipse(x,17+(mv?Math.sin(t*16+x)*2:0),6,3.5,0,0,7);X.fill();X.stroke()}}
X.fillStyle='#efe3c4';X.strokeStyle='#111';X.lineWidth=3;X.beginPath();X.ellipse(0,b,15,18,0,0,7);X.fill();X.stroke();
X.fillStyle='#9fb2c8';X.lineWidth=2;
if(c('ar')){X.fillRect(-9,b+2,18,10);X.strokeRect(-9,b+2,18,10)}
if(c('ar')>2){X.beginPath();X.arc(0,b-8,14,Math.PI,0);X.fill();X.stroke()}
X.fillStyle='#e53935';X.lineWidth=3;X.fillRect(-15,b-11,30,7);X.strokeRect(-15,b-11,30,7);
X.fillStyle=c('dm')?'#e53935':'#111';X.fillRect(-7,b-1,3,5);X.fillRect(4,b-1,3,5);X.fillStyle='#111';X.fillRect(-5,b+9,10,2);
X.lineWidth=2;
if(c('dm')){X.beginPath();X.moveTo(-9,b-3);X.lineTo(-3,b);X.moveTo(9,b-3);X.lineTo(3,b);X.stroke()}
if(c('rn')){X.strokeStyle='#ffd54a';X.beginPath();X.arc(5.5,b+1,5,0,7);X.stroke()}
if(c('as')&&(t*10|0)%3){X.fillStyle='#ffd54a';X.strokeStyle='#111';X.lineWidth=1.5;for(const s of[-1,1]){X.beginPath();X.moveTo(s*24,b-18);X.lineTo(s*18,b-8);X.lineTo(s*22,b-8);X.lineTo(s*17,b+2);X.lineTo(s*28,b-10);X.lineTo(s*23,b-10);X.closePath();X.fill();X.stroke()}}
if(c('rg')){const y=b-32+Math.sin(t*3)*2;X.fillStyle='#7bd34a';X.fillRect(-2,y-6,4,12);X.fillRect(-6,y-2,12,4)}
X.restore()}

function draw(){const P=S.P, th=TH[currLvl];
X.fillStyle=th.bg;X.fillRect(0,0,W,H);
X.strokeStyle=th.g;X.lineWidth=2;
for(let i=0;i<W;i+=48){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.moveTo(0,i);X.lineTo(W,i);X.stroke()}
S.bgd.forEach(d=>{
 if(th.fx==1){X.fillStyle='#3a663555';X.fillRect(d.x,d.y,4,8+d.s*6)}
 else if(th.fx==2){X.fillStyle='#85613366';X.beginPath();X.arc(d.x,d.y,2+d.s*3,0,7);X.fill()}
 else if(th.fx==3){X.fillStyle='#5a96bd44';X.fillRect(d.x,d.y,6+d.s*12,6+d.s*12)}
 else if(th.fx==4){X.fillStyle=(d.s>.8)?'#ff980055':'#ff572244';X.beginPath();X.arc(d.x,d.y,3+d.s*5,0,7);X.fill()}
 else if(th.fx==5){X.fillStyle='#ffffff'+(d.s>.6?'88':'33');X.beginPath();X.arc(d.x,d.y,1+d.s*2,0,7);X.fill()}
});
for(const f of S.F){X.fillStyle='#ffb04a66';dot(f.x,f.y,f.r)}
X.fillStyle='#7bd34a';for(const m of S.M)dot(m.x,m.y,5);
for(const e of S.E){blob(e);if(e.boss){X.fillStyle='#000';X.fillRect(e.x-e.r,e.y-e.r-16,e.r*2,8);X.fillStyle='#e53935';X.fillRect(e.x-e.r,e.y-e.r-16,(e.r*2)*(e.hp/e.mhp),8);X.lineWidth=2;X.strokeStyle='#111';X.strokeRect(e.x-e.r,e.y-e.r-16,e.r*2,8)}}
X.fillStyle='#ff5';for(const b of S.B)dot(b.x,b.y,b.ex?6:3.5);
X.fillStyle='#f44';for(const b of S.eb)dot(b.x,b.y,5);
if(S.m=='menu')menuBg();potato(P);if(S.m=='menu')return;
X.fillStyle='#000a';X.fillRect(10,10,200,20);X.fillRect(10,34,200,10);
X.fillStyle='#e53935';X.fillRect(10,10,200*Math.max(0,P.hp)/P.mh,20);
X.fillStyle='#7bd34a';X.fillRect(10,34,200*S.xp/(4+S.lv*3),10);
X.fillStyle='#fff';X.textAlign='left';X.font='bold 14px system-ui,sans-serif';
X.fillText(`HP ${P.hp|0}/${P.mh} · Nv ${S.lv}`,16,25);X.fillText('Materiales: '+S.mat,10,64);
X.textAlign='center';X.font='bold 30px system-ui,sans-serif';X.fillText(Math.max(0,Math.ceil(Math.max(0,S.dur-S.t))),W/2,38);
X.font='14px system-ui,sans-serif';X.fillText('Oleada '+S.w+' / 25',W/2,58);
let hx=10;for(const k of P.ws){X.drawImage(icv('w',k.k).c,hx,H-78,44,44);X.strokeStyle=TC[k.t];X.lineWidth=2;X.strokeRect(hx,H-78,44,44);hx+=48}
hx=10;X.textAlign='left';X.font='bold 12px system-ui,sans-serif';X.fillStyle='#fff';for(const k in P.u){X.drawImage(icv('u',k).c,hx,H-30,28,28);X.fillText('x'+P.u[k],hx+18,H-4);hx+=40}}
const kn=e=>e.key.length>1?e.key:e.key.toLowerCase();
onkeydown=e=>{const k=kn(e);K[k]=1;if(e.key.startsWith('Arrow'))e.preventDefault();if((k=='Escape'||k=='p')&&!e.repeat&&(S.m=='play'||S.m=='pause'))pz()};onkeyup=e=>{K[kn(e)]=0};
menu();
let L=0;(function f(t){const dt=Math.min(.05,(t-L)/1e3)||0;L=t;if(S.m=='play')upd(dt);else if(S.m=='menu')S.t+=dt;draw();requestAnimationFrame(f)})(0);
</script></body></html>
