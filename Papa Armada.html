<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Papa Armada</title><style>
:root{color-scheme:dark;--bg:#14121a;--fg:#f3efe6;--ac:#e53935;--gr:#7bd34a;--pn:#241f2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;justify-content:center}
#w{position:relative;width:min(100vw,150vh);max-width:960px}
canvas{width:100%;display:block;background:#2b2634;border:3px solid #000;box-sizing:border-box}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000b;text-align:center;padding:10px;overflow:auto}
#ov:empty{display:none}
h1{margin:0;font-size:clamp(24px,5vw,44px);color:var(--ac);text-shadow:3px 3px #000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--pn);color:var(--fg);border:2px solid var(--gr);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;min-width:130px}
button:hover:not(:disabled){background:#3a3248}button:disabled{opacity:.4;cursor:default}
.b{border-color:var(--ac);background:var(--ac);font-weight:700}
small{opacity:.85}
</style></head><body><div id="w"><canvas id="c" width="960" height="600"></canvas><div id="ov"></div></div><script>
const C=document.getElementById('c'),X=C.getContext('2d'),O=document.getElementById('ov'),W=960,H=600;
const R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),WK=Object.keys;
// d=daño c=cooldown r=alcance s=vel bala p=balas e=dispersión $=precio
const WP={
pistola:{n:'Pistola',d:15,c:.35,r:320,s:650,p:1,e:.05,$:20},
smg:{n:'SMG',d:6,c:.11,r:280,s:700,p:1,e:.14,$:35},
escopeta:{n:'Escopeta',d:7,c:.9,r:230,s:600,p:5,e:.5,$:45},
francotirador:{n:'Francotirador',d:60,c:1.5,r:620,s:1200,p:1,e:0,pi:3,$:70},
cohete:{n:'Cohete',d:40,c:1.4,r:420,s:380,p:1,e:.03,ex:70,$:80}};
const TC=['','#ccc','#6cf','#c8f','#f55'];
const ET=[{hp:10,v:75,r:12,d:4,c:'#7bd34a'},{hp:6,v:140,r:9,d:3,c:'#b06cff'},{hp:45,v:50,r:20,d:8,c:'#e0803a'},{hp:14,v:60,r:12,d:4,c:'#4ac8d9',sh:1}];
const UP=[['+15% daño','dm',.15],['+12% cadencia','as',.12],['+20 vida máx.','mh',20],['+10% velocidad','sp',.1],['+1 armadura','ar',1],['+0.5 vida/s','rg',.5],['+15% alcance','rn',.15],['+40% imán','mg',.4]];
let S,K={},mv=0;
function newGame(){S={m:'play',w:1,t:0,dur:20,lv:1,xp:0,mat:15,pend:0,kills:0,sp:1,of:0,
P:{x:W/2,y:H/2,hp:50,mh:50,ar:0,rg:0,sp:1,dm:0,as:0,rn:0,mg:0,iv:0,ws:[{k:'pistola',t:1,cd:0,a:0}]},E:[],B:[],M:[],F:[],eb:[]};startWave()}
function startWave(){S.m='play';S.t=0;S.dur=Math.min(20+(S.w-1)*5,50);S.sp=1;S.E=[];S.B=[];S.eb=[];S.F=[];O.innerHTML='';const P=S.P;P.hp=Math.min(P.mh,P.hp+P.mh*.4)}
function spawn(){if(S.E.length>110)return;const w=S.w,r=Math.random();let t=0;
if(w>=4&&r<.14)t=3;else if(w>=3&&r<.3)t=2;else if(w>=2&&r<.55)t=1;
const s=ET[t],q=Math.random()*4|0,x=q<2?R(20,W-20):(q==2?20:W-20),y=q>=2?R(20,H-20):(q==0?20:H-20),hp=s.hp*(1+w*.3);
S.E.push({...s,t,x,y,hp,f:0,a:R(0,2)})}
function hurt(n){const P=S.P;P.iv=.45;P.hp-=Math.max(1,n-P.ar)}
function gain(){S.mat++;if(++S.xp>=4+S.lv*3){S.xp=0;S.lv++;S.pend++}}
function boom(b){b.dead=1;S.F.push({x:b.x,y:b.y,r:b.ex,t:.25});for(const e of S.E)if(D(b,e)<b.ex+e.r){e.hp-=b.dm;e.f=.08}}
function upd(dt){const P=S.P,w=S.w;S.t+=dt;
const dx=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0),dy=(K.s||K.ArrowDown?1:0)-(K.w||K.ArrowUp?1:0),l=Math.hypot(dx,dy)||1;mv=dx||dy;
P.x=Math.max(18,Math.min(W-18,P.x+dx/l*180*P.sp*dt));P.y=Math.max(18,Math.min(H-18,P.y+dy/l*180*P.sp*dt));
P.iv-=dt;P.hp=Math.min(P.mh,P.hp+P.rg*dt);
if((S.sp-=dt)<=0){S.sp=Math.max(.2,1.1-w*.08);spawn();if(w>5&&Math.random()<.5)spawn()}
for(const e of S.E){e.f-=dt;const d=D(e,P),a=Math.atan2(P.y-e.y,P.x-e.x),c=Math.cos(a),s=Math.sin(a);
 if(e.sh){if(d>230){e.x+=c*e.v*dt;e.y+=s*e.v*dt}if((e.a-=dt)<=0){e.a=2.2;S.eb.push({x:e.x,y:e.y,vx:c*210,vy:s*210})}}
 else{e.x+=c*e.v*dt;e.y+=s*e.v*dt}
 if(d<e.r+14&&P.iv<=0)hurt(e.d*(1+w*.12))}
for(const b of S.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(D(b,P)<16&&P.iv<=0){hurt(5*(1+w*.12));b.dead=1}if(b.x<0||b.x>W||b.y<0||b.y>H)b.dead=1}
S.eb=S.eb.filter(b=>!b.dead);
for(const k of P.ws){const s=WP[k.k],r=s.r*(1+P.rn);k.cd-=dt;let n=null,bd=r;
 for(const e of S.E){const d=D(e,P);if(d<bd){bd=d;n=e}}
 if(n){k.a=Math.atan2(n.y-P.y,n.x-P.x);if(k.cd<=0){k.cd=s.c*Math.pow(.92,k.t-1)/(1+P.as);
 const dm=s.d*(1+.6*(k.t-1))*(1+P.dm);
 for(let j=0;j<s.p;j++){const a=k.a+R(-s.e,s.e);S.B.push({x:P.x,y:P.y,vx:Math.cos(a)*s.s,vy:Math.sin(a)*s.s,dm,l:r/s.s,pi:s.pi||0,ex:s.ex,h:new Set()})}}}}
for(const b of S.B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
 for(const e of S.E){if(b.dead)break;if(e.hp<=0||b.h.has(e)||D(b,e)>e.r+5)continue;
  if(b.ex)boom(b);else{e.hp-=b.dm;e.f=.08;b.h.add(e);if(b.pi--<=0)b.dead=1}}
 if(b.l<=0&&!b.dead){if(b.ex)boom(b);b.dead=1}}
for(const e of S.E)if(e.hp<=0){S.kills++;S.M.push({x:e.x,y:e.y});if(Math.random()<.3||e.t==2)S.M.push({x:e.x+R(-8,8),y:e.y+R(-8,8)})}
S.E=S.E.filter(e=>e.hp>0);S.B=S.B.filter(b=>!b.dead);
for(const m of S.M){const d=D(m,P);if(d<16){m.g=1;gain()}else if(d<70*(1+P.mg)){m.x+=(P.x-m.x)/d*320*dt;m.y+=(P.y-m.y)/d*320*dt}}
S.M=S.M.filter(m=>!m.g);
for(const f of S.F)f.t-=dt;S.F=S.F.filter(f=>f.t>0);
if(P.hp<=0)return end(0);
if(S.t>=S.dur){for(const m of S.M)gain();S.M=[];S.E=[];S.B=[];S.eb=[];if(S.w>=10)return end(1);S.m='x';S.pend>0?lvl():shop()}}
function apply(u){const P=S.P;P[u[1]]+=u[2];if(u[1]=='mh')P.hp+=u[2]}
function lvl(){S.m='lvl';S.ch=[...UP].sort(()=>Math.random()-.5).slice(0,3);
O.innerHTML=`<h1>¡Nivel ${S.lv-S.pend+1}!</h1><small>Elige una mejora (${S.pend} pendiente/s)</small><div class=row>${S.ch.map((u,i)=>`<button onclick=pick(${i})>${u[0]}</button>`).join('')}</div>`}
function pick(i){apply(S.ch[i]);S.pend--;S.pend>0?lvl():shop()}
function offer(){if(Math.random()<.6){const k=WK(WP)[R(0,5)|0];return{w:k,c:Math.round(WP[k].$*(1+S.w*.12))}}return{u:UP[R(0,UP.length)|0],c:10+S.w*3}}
function shop(){S.m='shop';S.of=S.of||Array.from({length:4},offer);const P=S.P;
O.innerHTML=`<h1>Tienda · Oleada ${S.w}</h1><div>Materiales: <b style="color:var(--gr)">${S.mat}</b> · Vida ${P.hp|0}/${P.mh}</div><div class=row>${S.of.map((o,i)=>{if(!o)return'<button disabled>Vendido</button>';let tx,ok=S.mat>=o.c;
 if(o.w){const h=P.ws.find(x=>x.k==o.w),s=WP[o.w];if(h){tx=`${s.n}<br><small>MEJORAR a nivel ${h.t+1}</small>`;ok=ok&&h.t<4}else{tx=`${s.n}<br><small>Arma nueva (${P.ws.length}/6)</small>`;ok=ok&&P.ws.length<6}}else tx=o.u[0];
 return`<button ${ok?'':'disabled'} onclick=buy(${i})>${tx}<br>${o.c} mat.</button>`}).join('')}</div>
<div class=row>${P.ws.map(k=>`<small style="color:${TC[k.t]}">${WP[k.k].n} Nv${k.t}</small>`).join(' · ')}</div>
<div class=row><button onclick=rr()>Cambiar (${3+S.w*2})</button><button class=b onclick=go()>Siguiente oleada ▶</button></div>`}
function buy(i){const o=S.of[i];S.mat-=o.c;if(o.w){const h=S.P.ws.find(x=>x.k==o.w);h?h.t++:S.P.ws.push({k:o.w,t:1,cd:0,a:0})}else apply(o.u);S.of[i]=0;shop()}
function rr(){const c=3+S.w*2;if(S.mat<c)return;S.mat-=c;S.of=Array.from({length:4},offer);shop()}
function go(){S.w++;S.of=0;startWave()}
function end(win){S.m='over';O.innerHTML=`<h1>${win?'¡Sobreviviste!':'Fin del juego'}</h1><div>Oleada ${S.w} · Nivel ${S.lv} · ${S.kills} bichos eliminados</div><button class=b onclick=newGame()>Jugar de nuevo</button>`}
function dot(x,y,r){X.beginPath();X.arc(x,y,r,0,7);X.fill()}
function blob(e){X.fillStyle=e.f>0?'#fff':e.c;X.strokeStyle='#111';X.lineWidth=3;X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill();X.stroke();
X.fillStyle='#111';const o=e.r*.35,q=e.r*.15+1;dot(e.x-o,e.y-o*.5,q);dot(e.x+o,e.y-o*.5,q)}
function potato(P){const n=P.ws.length;
P.ws.forEach((k,i)=>{const m=i/n*6.283-1.57;X.save();X.translate(P.x+Math.cos(m)*24,P.y+Math.sin(m)*24);X.rotate(k.a);X.fillStyle='#333';X.strokeStyle=TC[k.t];X.lineWidth=2;X.fillRect(-4,-3,18,6);X.strokeRect(-4,-3,18,6);X.restore()});
X.save();X.translate(P.x,P.y);if(P.iv>0&&(S.t*20|0)%2)X.globalAlpha=.5;
const b=mv?Math.sin(S.t*16)*2:0;
X.fillStyle='#0004';X.beginPath();X.ellipse(0,19,15,5,0,0,7);X.fill();
X.fillStyle='#efe3c4';X.strokeStyle='#111';X.lineWidth=3;X.beginPath();X.ellipse(0,b,15,18,0,0,7);X.fill();X.stroke();
X.fillStyle='#e53935';X.fillRect(-15,b-11,30,7);X.strokeRect(-15,b-11,30,7);
X.fillStyle='#111';X.fillRect(-7,b-1,3,5);X.fillRect(4,b-1,3,5);X.fillRect(-5,b+9,10,2);X.restore()}
function draw(){const P=S.P;X.fillStyle='#2b2634';X.fillRect(0,0,W,H);
X.strokeStyle='#ffffff0a';X.lineWidth=1;for(let i=0;i<W;i+=48){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.moveTo(0,i);X.lineTo(W,i);X.stroke()}
for(const f of S.F){X.fillStyle='#ffb04a66';dot(f.x,f.y,f.r)}
X.fillStyle='#7bd34a';for(const m of S.M)dot(m.x,m.y,5);
for(const e of S.E)blob(e);
X.fillStyle='#ff5';for(const b of S.B)dot(b.x,b.y,b.ex?6:3.5);
X.fillStyle='#f44';for(const b of S.eb)dot(b.x,b.y,5);
potato(P);
X.fillStyle='#000a';X.fillRect(10,10,200,20);X.fillRect(10,34,200,10);
X.fillStyle='#e53935';X.fillRect(10,10,200*Math.max(0,P.hp)/P.mh,20);
X.fillStyle='#7bd34a';X.fillRect(10,34,200*S.xp/(4+S.lv*3),10);
X.fillStyle='#fff';X.textAlign='left';X.font='bold 14px system-ui,sans-serif';
X.fillText(`HP ${P.hp|0}/${P.mh} · Nv ${S.lv}`,16,25);X.fillText('Materiales: '+S.mat,10,64);
X.textAlign='center';X.font='bold 30px system-ui,sans-serif';X.fillText(Math.max(0,Math.ceil(S.dur-S.t)),W/2,38);
X.font='14px system-ui,sans-serif';X.fillText('Oleada '+S.w+' / 10',W/2,58)}
const kn=e=>e.key.length>1?e.key:e.key.toLowerCase();
onkeydown=e=>{K[kn(e)]=1;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>{K[kn(e)]=0};
newGame();S.m='menu';
O.innerHTML='<h1>PAPA ARMADA</h1><div>Eres una papa con un arsenal. Sobrevive 10 oleadas.</div><small>Muévete con WASD o las flechas · Las armas apuntan y disparan solas<br>Recoge materiales para subir de nivel y comprar o mejorar armas</small><button class=b onclick=newGame()>JUGAR</button>';
let L=0;(function f(t){const dt=Math.min(.05,(t-L)/1e3)||0;L=t;if(S.m=='play')upd(dt);draw();requestAnimationFrame(f)})(0);
</script></body></html>
