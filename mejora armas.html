else if(q=='f'){O(4,0,9,c1);R(8,-6,5,12,c2);g.beginPath();g.moveTo(10,-2);g.lineTo(13,-2);g.moveTo(10,2);g.lineTo(13,2);g.stroke()}
else if(q=='r'){for(let i=0;i<8;i++){g.beginPath();g.moveTo(8+Math.cos(i*.785)*L/2,Math.sin(i*.785)*L/2);g.lineTo(8+Math.cos(i*.785)*(L/2+5),Math.sin(i*.785)*(L/2+5));g.lineWidth=4;g.stroke()}g.lineWidth=2;O(8,0,L/2,c1);O(8,0,3,c2)}
else if(q=='l'){R(-10,-4,L,8,c1);R(L-10,-6,6,12,c2);R(-8,3,5,8,'#444')}
else if(q=='k'){g.fillStyle=c1;g.beginPath();for(let i=0;i<8;i++){const r=i%2?4:L/2;g.lineTo(8+Math.cos(i*.785)*r,Math.sin(i*.785)*r)}g.closePath();g.fill();g.stroke()}
else{g.lineWidth=4;g.strokeStyle=c1;g.beginPath();g.moveTo(-6,10);g.lineTo(-6,0);g.lineTo(-12,-10);g.moveTo(-6,0);g.lineTo(0,-10);g.stroke();g.strokeStyle='#e33';g.lineWidth=1.5;g.beginPath();g.moveTo(-12,-10);g.lineTo(0,-10);g.stroke()}}

// ---- EFECTOS Y COMBATE ----
function hit(e,dm,s,a){const P=S.P;if(Math.random()<(s.cr||0))dm*=s.cm||2;e.hp-=dm;e.f=.08;const kb=e.boss?0:(s.kb||8);e.x+=Math.cos(a)*kb;e.y+=Math.sin(a)*kb;
if(s.bu){e.bn=3;e.bd=s.bu}if(s.ls)P.hp=Math.min(P.mh,P.hp+dm*s.ls);
if(s.ch){let n=s.ch;for(const o of S.E)if(n>0&&o!=e&&o.hp>0&&D(o,e)<150){o.hp-=dm*.6;o.f=.08;S.L.push({a:e,b:o,t:.12});n--}}}
function boom2(b){b.dead=1;const s=b.s;S.F.push({x:b.x,y:b.y,r:s.ex,t:.25});for(const e of S.E)if(e.hp>0&&D(b,e)<s.ex+e.r)hit(e,b.dm,s,Math.atan2(e.y-b.y,e.x-b.x))}
function fire(dt){const P=S.P;for(const k of P.ws){const s=WP[k.k],r=s.r*(1+P.rn);k.cd-=dt;let n=null,bd=r;
for(const e of S.E){const d=D(e,P);if(e.hp>0&&d<bd){bd=d;n=e}}
if(!n)continue;k.a=Math.atan2(n.y-P.y,n.x-P.x);if(k.cd>0)continue;k.cd=s.c*Math.pow(.92,k.t-1)/(1+P.as);
const dm=s.d*(1+.6*(k.t-1))*(1+P.dm);
if(s.m){for(const e of S.E){if(e.hp<=0||D(e,P)>=r+e.r)continue;let df=Math.abs(Math.atan2(e.y-P.y,e.x-P.x)-k.a);if(df>Math.PI)df=6.283-df;if(df<s.arc)hit(e,dm,s,k.a)}
S.F.push({x:P.x,y:P.y,a:k.a,r,arc:s.arc,t:.12,ml:1})}
else for(let j=0;j<(s.p||1);j++){const a=k.a+R(-(s.e||0),s.e||0);S.B2.push({x:P.x,y:P.y,vx:Math.cos(a)*s.s,vy:Math.sin(a)*s.s,dm,l:r/s.s,s,pi:s.pi||0,bo:s.bo||0,h:new Set()})}}}
function moveB(dt){for(const b of S.B2){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;const s=b.s;
for(const e of S.E){if(b.dead)break;if(e.hp<=0||b.h.has(e)||D(b,e)>e.r+6)continue;
if(s.ex){boom2(b);break}hit(e,b.dm,s,Math.atan2(b.vy,b.vx));b.h.add(e);
if(b.bo>0){let n=null,bd=260;for(const o of S.E)if(o.hp>0&&!b.h.has(o)){const d=D(o,b);if(d<bd){bd=d;n=o}}
if(n){const a=Math.atan2(n.y-b.y,n.x-b.x),v=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*v;b.vy=Math.sin(a)*v;b.bo--;b.l+=.3;continue}}
if(b.pi--<=0)b.dead=1}
if(b.l<=0&&!b.dead){if(s.ex)boom2(b);b.dead=1}}
S.B2=S.B2.filter(b=>!b.dead);for(const l of S.L)l.t-=dt;S.L=S.L.filter(l=>l.t>0)}

// ---- ENGANCHES (no tocan tu código original) ----
const _ng=newGame,_sp=spawn,_sb=spawnB,_up=upd,_dr=draw,_sh=shop;
newGame=function(){_ng();S.lvs*=1.5;S.B2=[];S.L=[]};
spawn=function(){let n=S.E.length;_sp();if(S.E.length>n){const e=S.E[S.E.length-1];e.v*=1.15;e.d*=1.2}
if(S.w>1&&S.E.length<150&&Math.random()<.6){n=S.E.length;_sp();if(S.E.length>n)S.E[S.E.length-1].v*=1.15}};
spawnB=function(t){_sb(t);const b=S.E[S.E.length-1];b.hp*=3;b.mhp=b.hp;b.v*=1.25;b.d*=1.5};

if(!S.B2||S.t<.1){S.B2=[];S.L=[]}

if(e.boss){e.sm=(e.sm??4)-dt;if(e.sm<=0){e.sm=5;for(let i=0;i<3;i++){const t=i%2,s=ET[t];S.E.push({...s,t,x:e.x+R(-40,40),y:e.y+R(-40,40),hp:s.hp*(1+S.w*.3)*S.lvs,f:0,a:0})}}}}
fire(dt);moveB(dt)};
draw=function(){_dr();if(S.m=='menu'||!S.B2)return;
for(const e of S.E)if(e.bn>0){X.fillStyle='#f853';dot(e.x,e.y,e.r+4)}
for(const b of S.B2){const s=b.s;X.save();X.translate(b.x,b.y);X.rotate(Math.atan2(b.vy,b.vx));X.fillStyle=s.bc||'#fe0';X.strokeStyle='#111';X.lineWidth=1.5;
if(s.ex){X.fillRect(-7,-3,14,6);X.strokeRect(-7,-3,14,6)}else if(s.v[0]=='k'||s.v[0]=='r'){X.rotate(S.t*20);X.fillRect(-5,-5,10,10);X.strokeRect(-5,-5,10,10)}else if(s.p>1||s.e>.2){X.beginPath();X.arc(0,0,3.5,0,7);X.fill();X.stroke()}else{X.fillRect(-6,-2,12,4)}X.restore()}
X.strokeStyle='#ff8';X.lineWidth=3;for(const l of S.L){X.beginPath();X.moveTo(l.a.x,l.a.y);X.lineTo((l.a.x+l.b.x)/2+R(-8,8),(l.a.y+l.b.y)/2+R(-8,8));X.lineTo(l.b.x,l.b.y);X.stroke()}};
shop=function(){if(S.ws0&&!S.P.ws.length)S.P.ws=S.ws0;_sh();O.querySelectorAll('button[onclick^=buy]').forEach(b=>{const o=S.of[+b.getAttribute('onclick').match(/\d+/)[0]];
if(o&&o.w){const s=WP[o.w],h=S.P.ws.find(x=>x.k==o.w),t=h?h.t+1:1;
b.insertAdjacentHTML('beforeend',`<small>Daño ${Math.round(s.d*(1+.6*(t-1)))}${s.p>1?'×'+s.p:''} · ${(1/(s.c*Math.pow(.92,t-1))).toFixed(1)} disp/s${s.cr?' · crít. '+Math.round(s.cr*100)+'%':''}${s.ds?'<br><i>'+s.ds+'</i>':''}</small>`)}})};
document.head.insertAdjacentHTML('beforeend','<style>button small{display:block;max-width:190px;margin:2px auto 0;line-height:1.25}button i{opacity:.8;font-size:12px}</style>');

menu();let L=0;(function f(t){const dt=Math.min(.05,(t-L)/1e3)||0;L=t;if(S.m=='play')upd(dt);else if(S.m=='menu')S.t+=dt;draw();requestAnimationFrame(f)})(0);
